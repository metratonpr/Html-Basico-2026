<!-- Tipo do documento ex xml, html-->
<!DOCTYPE html>
<!-- Idioma -->
<html lang="pt-BR">
<!-- Informações de SEO, carregamento antes de mostra a pagina -->

<head>
    <!-- Caracteres: Latim, Windows, ISO, Chinese, Japanese -->
    <meta charset="UTF-8">
    <!-- Viewport Ocupação da Tela - Responsividade -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Titulo da Pagina -->
    <title>Curso HTML - Fulano de Tal | HMTL | CSS | JS</title>

    <!-- Search Engine Optimization - Otimização do Motor de Busca -->
    <meta name="description" content="Curso de HTML, CSS e JS em Castro-PR,
    elabora pelo SENAC">

    <!-- Colocar as palavras Chave -->
    <meta name="keywords" content="HTML, CSS, JS, webdesign, programação web, 
     html 5">

    <!-- Permitir Robos -->
    <meta name="robots" content="index, follow">

    <!--Vou carregar tudo aquilo que seja necessario antes de mostrar a pagina  -->
    <link rel="stylesheet" href="styles.css">
    <!-- <link rel="stylesheet" href="estilo.css"> -->
</head>
<!-- E o que vai aparecer na tela do usuario -->

<body>
    <!-- Cabeçalho: Logo, Menus, Botões do Celula -->
    <!-- Div = Container - serve pra guardar algo -->
     <div id="header"></div>
    <!-- Main: Conteudo Principal -->
    <main>
        <!-- Hero: Titulo - Texto - Botão - Imagem -->
         <div id="hero"></div>
<!-- Beneficios (Vantagens): Titulo - Textos - Cards  -->
         <div id="beneficios"></div>
        <!-- Sobre: Explicar a Empresa, Produto ou Serviço -->
        <div id="sobre"></div>
        <!-- Call to Action - CTA ou chamado para ação: Comece agora, curte, 
          compartilhe, inscreva-se, saiba mais, etc -->
          <div id="cta"></div>
        <!-- Contato: Formulario, Endereço, Telefone, etc -->
         <div id="contato"></div>
    </main>
    <!-- Rodape: Informações, Links, Mapas, Redes Sociais -->
    <footer>
        <div id="footer"></div>
    </footer>
    <!-- Scripts: Codigos Javascript -->
    <script src="scripts.js"></script>
</body>

</html>
